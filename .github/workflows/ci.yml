# Pushes and pull requests are checked against the pinned Bend (package.json's
# bendRelease; bendWindows on Windows), which bend-lint downloads. The daily
# run, and a run started by hand, pin Bend's main branch instead on Linux, to
# see drift before Bend releases it.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Pin Bend's main branch
        if:
          runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name ==
          'workflow_dispatch')
        run: |
          sed -i 's#"bendRelease": "\([^/"]*/[^/"]*\)/[^"]*"#"bendRelease": "\1/main"#' package.json
      - run: bun test --parallel
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
